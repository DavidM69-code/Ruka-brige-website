<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<title>German Matching Game</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:0; }
  .page { display:none; padding:20px; }
  #mainPage { display:block; }
  button { padding:10px 20px; margin:5px; font-size:18px; color:black; background:white; border:2px solid #ccc; border-radius:10px; cursor:pointer; transition:0.3s; }
  .level-btn { width:120px; }
  .correct { background:#4caf50 !important; color:black; }
  .wrong { background:#ff4d4d !important; color:black; }
  .selected { background:#d9d9d9 !important; color:black; }
  #words { display:flex; justify-content:space-between; margin-top:20px; }
  #leftCol, #rightCol { width:45%; display:flex; flex-direction:column; gap:10px; }
  svg line { stroke-width:4; stroke-linecap:round; }
</style>
</head>
<body><div id="mainPage" class="page">
  <h1>Select Level</h1>
  <div id="level-select"></div>
</div><div id="gamePage" class="page">
  <button id="backBtn">Back</button>
  <h2 id="gameHeader"></h2>
  <svg id="lines" width="100%" height="400px" style="position:absolute; top:150px; left:0; pointer-events:none;"></svg>
  <div id="words">
    <div id="leftCol"></div>
    <div id="rightCol"></div>
  </div>
  <h3 id="attempts"></h3>
  <button id="retryBtn">Retry</button>
</div><script>
const LEVELS = {
  1:{de:["ich","du","er","sie","wir","ihr","sie (they)","sein","haben","gehen"],en:["I","you","he","she","we","you (pl)","they","to be","to have","to go"]},
  2:{de:["kommen","machen","sehen","sprechen","essen","trinken","lernen","schreiben","lesen","wohnen"],en:["to come","to do","to see","to speak","to eat","to drink","to learn","to write","to read","to live"]},
  3:{de:["Haus","Auto","Buch","Tisch","Stuhl","Fenster","Tür","Straße","Schule","Stadt"],en:["house","car","book","table","chair","window","door","street","school","city"]},
  4:{de:["Hund","Katze","Vogel","Fisch","Brot","Wasser","Milch","Apfel","Banane","Ei"],en:["dog","cat","bird","fish","bread","water","milk","apple","banana","egg"]},
  5:{de:["Mann","Frau","Kind","Freund","Lehrer","Arzt","Name","Tag","Woche","Jahr"],en:["man","woman","child","friend","teacher","doctor","name","day","week","year"]},
  6:{de:["heute","morgen","gestern","immer","nie","oft","jetzt","bald","langsam","schnell"],en:["today","tomorrow","yesterday","always","never","often","now","soon","slow","fast"]},
  7:{de:["rot","blau","gelb","grün","schwarz","weiß","klein","groß","alt","neu"],en:["red","blue","yellow","green","black","white","small","big","old","new"]},
  8:{de:["kalt","warm","heiß","schön","schlecht","richtig","falsch","billig","teuer","leicht"],en:["cold","warm","hot","beautiful","bad","correct","wrong","cheap","expensive","easy"]},
  9:{de:["schwer","ruhig","laut","früh","spät","links","rechts","oben","unten","mitte"],en:["hard","calm","loud","early","late","left","right","up","down","middle"]},
  10:{de:["arbeiten","spielen","stehen","sitzen","laufen","fahren","springen","schlafen","öffnen","schließen"],en:["to work","to play","to stand","to sit","to run","to drive","to jump","to sleep","to open","to close"]},
  11:{de:["schreiben","lesen","kochen","kaufen","verkaufen","bezahlen","suchen","finden","nehmen","geben"],en:["to write","to read","to cook","to buy","to sell","to pay","to search","to find","to take","to give"]},
  12:{de:["Frühstück","Mittagessen","Abendessen","Zimmer","Bad","Küche","Garten","Park","Brücke","Fluss"],en:["breakfast","lunch","dinner","room","bathroom","kitchen","garden","park","bridge","river"]},
  13:{de:["Berg","Meer","Wald","Insel","Wüste","Himmel","Erde","Feuer","Wasser","Luft"],en:["mountain","sea","forest","island","desert","sky","earth","fire","water","air"]},
  14:{de:["Frage","Antwort","Wort","Satz","Bild","Zeit","Hand","Kopf","Herz","Welt"],en:["question","answer","word","sentence","picture","time","hand","head","heart","world"]},
  15:{de:["Arbeit","Schule","Universität","Krankenhaus","Supermarkt","Cafe","Restaurant","Hotel","Bahnhof","Flughafen"],en:["work","school","university","hospital","supermarket","cafe","restaurant","hotel","train station","airport"]},
  16:{de:["Regen","Schnee","Wind","Sturm","Wolke","Sonne","Mond","Stern","Nebel","Hitze"],en:["rain","snow","wind","storm","cloud","sun","moon","star","fog","heat"]},
  17:{de:["Glück","Liebe","Hunger","Durst","Angst","Freude","Trauer","Mut","Stärke","Schwäche"],en:["luck","love","hunger","thirst","fear","joy","sadness","courage","strength","weakness"]},
  18:{de:["Flasche","Tasse","Becher","Gabel","Messer","Löffel","Teller","Topf","Pfanne","Korb"],en:["bottle","cup","mug","fork","knife","spoon","plate","pot","pan","basket"]},
  19:{de:["Computer","Handy","Tablet","Fernseher","Radio","Lampe","Stuhl","Bett","Schrank","Spiegel"],en:["computer","phone","tablet","TV","radio","lamp","chair","bed","closet","mirror"]},
  20:{de:["Straße","Kreuzung","Ampel","Auto","Bus","Zug","Fahrrad","Motorrad","Taxi","Flugzeug"],en:["street","intersection","traffic light","car","bus","train","bicycle","motorcycle","taxi","airplane"]}
};

let currentLevel = null;
let leftSelected = null;
let correctPairs = 0;
let attempts = 0;

function show(page){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById(page).style.display='block'; }

function loadLevels(){
  let box = document.getElementById("level-select");
  for(let i=1;i<=20;i++){
    let b=document.createElement("button");
    b.className="level-btn";
    b.textContent="Level "+i;
    b.onclick=()=>startLevel(i);
    box.appendChild(b);
  }
}

function startLevel(num){
  currentLevel = num;
  show("gamePage");
  document.getElementById("gameHeader").textContent = "Level "+num;
  loadWords(num);
}
unction loadWords(num){
  const data = LEVELS[num];
  const de = [...data.de];
  const en = [...data.en];

  let left = document.getElementById("leftCol");
  let right = document.getElementById("rightCol");
  left.innerHTML = "";
  right.innerHTML = "";
  document.getElementById("lines").innerHTML="";

  leftSelected=null;
  correctPairs=0;
  attempts=0;
  document.getElementById("attempts").textContent="Attempts: 0";

  en.sort(()=>Math.random()-0.5);

  de.forEach((w,i)=>{
    let btn=document.createElement("button");
    btn.textContent=w;
    btn.onclick=()=>selectLeft(btn,i);
    left.appendChild(btn);
  });

  en.forEach((w,i)=>{
    let btn=document.createElement("button");
    btn.textContent=w;
    btn.onclick=()=>selectRight(btn,i);
    right.appendChild(btn);
  });
}

function selectLeft(btn,i){
  leftSelected={btn,index:i};
  document.querySelectorAll('#leftCol button').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectRight(btn,i){
  if(!leftSelected) return;

  attempts++;
  document.getElementById("attempts").textContent="Attempts: "+attempts;

  if(i===leftSelected.index){
    leftSelected.btn.classList.add('correct');
    btn.classList.add('correct');
    drawLine(leftSelected.btn,btn);
    correctPairs++;
  } else {
    leftSelected.btn.classList.add('wrong');
    btn.classList.add('wrong');
    setTimeout(()=>{
      leftSelected.btn.classList.remove('wrong');
      btn.classList.remove('wrong');
    },500);
  }

  leftSelected=null;
  document.querySelectorAll('#leftCol button').forEach(b=>b.classList.remove('selected'));
}

function drawLine(a,b){
  const svg=document.getElementById("lines");
  let r1=a.getBoundingClientRect();
  let r2=b.getBoundingClientRect();
  let line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",r1.right);
  line.setAttribute("y1",r1.top+ r1.height/2 -150);
  line.setAttribute("x2",r2.left);
  line.setAttribute("y2",r2.top+ r2.height/2 -150);
  line.setAttribute("stroke","green");
  svg.appendChild(line);
}

document.getElementById("retryBtn").onclick=()=>loadWords(currentLevel);
document.getElementById("backBtn").onclick=()=>show("mainPage");

loadLevels();
</script></body>
</html>
