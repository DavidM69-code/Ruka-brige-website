<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Match Game</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }header {
    background: #ffffff;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

#menu, #gameArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.btn {
    background: #ffffff;
    border: 2px solid #333;
    padding: 15px 35px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px;
    color: #000;
    transition: 0.2s;
}

.btn:hover {
    background: #e5e5e5;
}

#levels {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 20px;
    width: 90%;
}

.levelBtn {
    padding: 15px;
    background: #fff;
    border: 2px solid #444;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    cursor: pointer;
    color: #000;
}

.levelBtn.locked {
    background: #999;
    color: #555;
    border-color: #777;
    cursor: default;
}

#gameArea {
    display: none;
    position: relative;
    width: 100vw;
    height: 100vh;
    padding-top: 40px;
}

.column {
    width: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.wordBtn {
    width: 70%;
    padding: 15px;
    background: #fff;
    border: 2px solid #222;
    color: #000;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
}

#topControls {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
}

</style>
</head>
<body><header>Word Match Game</header><div id="menu">
    <button class="btn" onclick="setLanguage('german')">German</button>
    <button class="btn" onclick="setLanguage('russian')">Russian</button>
    <button class="btn" id="startBtn">Start</button>
    <button class="btn" onclick="showLevels()">Levels</button>
</div><div id="levels" style="display:none;"></div><div id="gameArea">
    <div id="topControls">
        <button class="btn" onclick="speakSelected()">🔊 Speak</button>
        <button class="btn" onclick="exitLevel()">Exit</button>
    </div><div class="column" id="leftCol"></div>
<div class="column" id="rightCol"></div>

</div><svg id="lineCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></svg>

<script>
let current = { level: 1, language: "german" };
let session = { selected: null, connections: [] };

function setLanguage(lang){
    current.language = lang;
    alert("Language set to: " + lang);
}

const LEVELS = {
    german: Array.from({length:20},()=>[
        {left:"Haus", right:"Kuća"},
        {left:"Wasser", right:"Voda"},
        {left:"Baum", right:"Drvo"},
        {left:"Hund", right:"Pas"},
        {left:"Tag", right:"Dan"}
    ]),

    russian: Array.from({length:20},()=>[
        {left:"Дом", right:"Kuća"},
        {left:"Вода", right:"Voda"},
        {left:"Дерево", right:"Drvo"},
        {left:"Собака", right:"Pas"},
        {left:"День", right:"Dan"}
    ])
};

function speak(text){
    let ut = new SpeechSynthesisUtterance(text);
    ut.lang = current.language === "german" ? "de-DE" : "ru-RU";
    speechSynthesis.speak(ut);
}

function speakSelected(){
    if(session.selected) speak(session.selected.word);
}

document.getElementById("startBtn").onclick = ()=>{
    openLevel(current.level);
};

function showLevels(){
    document.getElementById("menu").style.display="none";
    let lv = document.getElementById("levels");
    lv.style.display="grid";
    lv.innerHTML = "";

    for(let i=1;i<=20;i++){
        let b = document.createElement("div");
        b.className="levelBtn";
        b.innerText="Level "+i;
        b.onclick = ()=>openLevel(i);
        lv.appendChild(b);
    }
}

function openLevel(n){
    current.level = n;
    document.getElementById("menu").style.display="none";
    document.getElementById("levels").style.display="none";
    document.getElementById("gameArea").style.display="flex";
    loadLevel();
}

function loadLevel(){
    session.selected = null;
    session.connections = [];

    let left = document.getElementById("leftCol");
    let right = document.getElementById("rightCol");

    left.innerHTML="";
    right.innerHTML="";

    let data = LEVELS[current.language][current.level-1];

    data.forEach((pair,i)=>{
        let b=document.createElement("button");
        b.className="wordBtn";
        b.innerText = pair.left;
        b.onclick = ()=>selectWord("left", pair.left, i, b);
        left.appendChild(b);
    });

    data.forEach((pair,i)=>{
        let b=document.createElement("button");
        b.className="wordBtn";
        b.innerText = pair.right;
        b.onclick = ()=>selectWord("right", pair.right, i, b);
        right.appendChild(b);
    });

    drawLines();
}

function selectWord(side, word, index, btn){
    if(!session.selected){
        session.selected = { side, word, index, btn };
        btn.style.background = "#d0ffd0";
    } else {
        if(session.selected.side !== side){
            session.connections.push({i1: session.selected.index, i2: index});
            session.selected.btn.style.background = "#fff";
            btn.style.background = "#fff";
            session.selected = null;
            drawLines();
        } else {
            session.selected.btn.style.background = "#fff";
            session.selected = null;
        }
    }
}

function drawLines(){
    const svg = document.getElementById("lineCanvas");
    svg.innerHTML = "";

    let leftBtns = document.querySelectorAll('#leftCol .wordBtn');
    let rightBtns = document.querySelectorAll('#rightCol .wordBtn');

    session.connections.forEach(c=>{
        let l = leftBtns[c.i1].getBoundingClientRect();
        let r = rightBtns[c.i2].getBoundingClientRect();

        let line = document.createElementNS("http://www.w3.org/2000/svg","line");
        line.setAttribute("x1", l.right);
        line.setAttribute("y1", l.top + l.height/2);
        line.setAttribute("x2", r.left);
        line.setAttribute("y2", r.top + r.height/2);
        line.setAttribute("stroke", "black");
        line.setAttribute("stroke-width", "3");
        svg.appendChild(line);
    });
}

function exitLevel(){
    document.getElementById("gameArea").style.display="none";
    document.getElementById("menu").style.display="flex";
}
</script></body>
</html>
