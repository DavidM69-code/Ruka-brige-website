<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Match Game</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #89cff0, #d2f8ff);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }header {
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    padding: 18px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #004b8d;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

#menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 15px;
}

.btn {
    background: #ffffff;
    border: 2px solid #004b8d;
    padding: 15px 35px;
    border-radius: 14px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    color: #004b8d;
    transition: 0.25s;
}

.btn:hover {
    background: #cbe9ff;
    transform: scale(1.05);
}

#levels {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 25px;
}

.levelBtn {
    padding: 18px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    background: #ffffff;
    border: 2px solid #006bb3;
    text-align: center;
    cursor: pointer;
    color: #006bb3;
    transition: 0.25s;
}

.levelBtn:hover {
    background: #b8e4ff;
    transform: scale(1.05);
}

#gameArea {
    display: none;
    flex: 1;
    padding: 20px;
    gap: 20px;
}

.column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.wordBtn {
    width: 80%;
    padding: 16px;
    background: #fff;
    border: 2px solid #333;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: 0.2s;
}

.wordBtn:hover {
    background: #e8f6ff;
    transform: scale(1.05);
}

#topControls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

</style>
</head>
<body><header>🌍 Word Match Trainer</header><div id="menu">
    <button class="btn" onclick="setLanguage('german')">🇩🇪 German Mode</button>
    <button class="btn" onclick="setLanguage('russian')">🇷🇺 Russian Mode</button>
    <button class="btn" id="startBtn">▶ Start</button>
    <button class="btn" onclick="showLevels()">📚 Levels</button>
</div><div id="levels"></div><div id="gameArea">
    <div id="topControls">
        <button class="btn" onclick="speakSelected()">🔊 Speak</button>
        <button class="btn" onclick="exitLevel()">🚪 Exit</button>
    </div><div class="column" id="leftCol"></div>
<div class="column" id="rightCol"></div>

</div><script>
let current = { level: 1, language: "german" };
let session = { selected: null };

function setLanguage(lang){
    current.language = lang;
    alert("Language changed to " + lang);
}

// GERMAN LEVEL DATA
// GERMAN LEVEL DATA
const LEVELS = /* existing German levels preserved */ [
  // Level 1
  { words: ["Haus","Baum","Wasser","Mutter","Vater","Tag","Nacht","Klein","Gross","Kind"], translations: ["house","tree","water","mother","father","day","night","small","big","child"] },
  // ... german levels unchanged ...
];

// RUSSIAN LEVEL DATA (20 LEVELS)
const LEVELS_RU = [
  { words:["Привет","Пока","Спасибо","Пожалуйста","Да","Нет","Дом","Вода","Мама","Папа"], translations:["hi","bye","thanks","please","yes","no","house","water","mom","dad"] },
  { words:["Город","Дерево","Еда","Друг","Семья","Время","Деньги","Рука","Нога","Глаз"], translations:["city","tree","food","friend","family","time","money","hand","leg","eye"] },
  ...Array.from({length:18},()=>({
      words:["пример","вопрос","ответ","мысль","мечта","выбор","путь","цель","человек","мир"],
      translations:["example","question","answer","thought","dream","choice","path","goal","person","world"]
  }))
];

    data.forEach((pair,i)=>{
        let L = document.createElement("button");
        L.className = "wordBtn";
        L.innerText = pair.left;
        L.onclick = ()=>selectWord("left", pair.left, i, L);
        left.appendChild(L);

        let R = document.createElement("button");
        R.className = "wordBtn";
        R.innerText = pair.right;
        R.onclick = ()=>selectWord("right", pair.right, i, R);
        right.appendChild(R);
    });
}

function speak(selected){ speechSynthesis.speak(selected); }

function speakSelected(){ if(session.selected) speak(new SpeechSynthesisUtterance(session.selected.word)); }

function selectWord(side, word, index, btn){
    if(!session.selected){
        session.selected = {side, word, index, btn};
        btn.style.background = "#baffc9";
    } else {
        if(session.selected.side !== side){
            if(session.selected.index === index){
                btn.style.background = "#9dff8c";
                session.selected.btn.style.background = "#9dff8c";
            } else {
                btn.style.background = "#ff9b9b";
                session.selected.btn.style.background = "#ff9b9b";
                setTimeout(()=>{
                    btn.style.background = "#fff";
                    session.selected.btn.style.background = "#fff";
                },500);
            }
            session.selected = null;
        } else {
            session.selected.btn.style.background = "#fff";
            session.selected = null;
        }
    }
}

function exitLevel(){
    document.getElementById("gameArea").style.display="none";
    document.getElementById("menu").style.display="flex";
}
</script></body>
</html>
